; aqtinstall settings for hosts where download.qt.io is unreachable.
;
; Even with --base, aqt fetches checksums from download.qt.io and fails
; with ChecksumDownloadFailure. trusted_mirrors moves hash retrieval to a
; reachable mirror as well.
;
; NOTE: keep this file ASCII-only. aqt reads it with the system locale
; codec (cp1251 here), so any UTF-8 byte above 0x7F breaks parsing.
;
; Usage:
;   python -m aqt -c tools/aqt_settings.ini install-qt windows desktop \
;       6.8.3 win64_msvc2022_64 --outputdir H:\Qt \
;       --base https://mirror.yandex.ru/mirrors/qt.io/

[aqt]
concurrency: 4
baseurl: https://mirror.yandex.ru/mirrors/qt.io
print_stacktrace_on_error: True
always_keep_archives: False
min_module_size: 41

[requests]
connection_timeout: 60
response_timeout: 60
max_retries_on_connection_error: 8
retry_backoff: 0.5
max_retries_on_checksum_error: 5
max_retries_to_retrieve_hash: 8
hash_algorithm: sha256
INSECURE_NOT_FOR_PRODUCTION_ignore_hash: False

[mirrors]
trusted_mirrors:
    https://mirror.yandex.ru/mirrors/qt.io
    https://ftp.acc.umu.se/mirror/qt.io/qtproject
    https://mirrors.ustc.edu.cn/qtproject
fallbacks:
    https://mirror.yandex.ru/mirrors/qt.io
    https://ftp.acc.umu.se/mirror/qt.io/qtproject
    https://mirrors.ustc.edu.cn/qtproject
    https://mirrors.tuna.tsinghua.edu.cn/qt
    https://qt.mirror.constant.com
