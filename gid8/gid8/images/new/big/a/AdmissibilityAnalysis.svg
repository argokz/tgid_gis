<svg width="55" height="55" viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Анализ режима</title>
  <desc id="desc">Минималистичная иконка анализа режима — круг с аккуратным аналитическим графиком внутри</desc>

  <!-- Внешний контур круга -->
  <circle cx="27.5" cy="27.5" r="18.5" stroke="#005BFF" stroke-width="2"/>

  <!-- Внутренний «индикатор» -->
  <circle cx="27.5" cy="27.5" r="10.5" fill="white" stroke="#E6E6E6" stroke-width="1.4"/>

  <!-- Аналитическая линия -->
  <polyline points="20,33 24,27 27,29 31,23 35,25" 
            fill="none" 
            stroke="#005BFF" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Точки данных -->
  <circle cx="20" cy="33" r="1.5" fill="#06F3FF"/>
  <circle cx="24" cy="27" r="1.5" fill="#06F3FF"/>
  <circle cx="27" cy="29" r="1.5" fill="#06F3FF"/>
  <circle cx="31" cy="23" r="1.5" fill="#06F3FF"/>
  <circle cx="35" cy="25" r="1.5" fill="#06F3FF"/>
</svg>
