<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справка</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }

        .container {
            width: 100% !important;
            /* Измените здесь значение на нужное */
        }

        .document-list {
            margin-top: 20px;
        }

        .document-list ul {
            list-style-type: none;
            padding-left: 0;
        }

        .document-list ul ul {
            padding-left: 20px;
            border-left: 2px solid #ccc;
            margin-left: 10px;
        }

        .document-list li {
            cursor: pointer;
            padding: 5px 10px;
            margin: 5px 0;
            border-radius: 5px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .document-list li:hover,
        .document-list li:focus {
            background-color: #e0e7fa;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
            outline: none;
        }

        iframe {
            width: 100%;
            height: 80vh;
            border: none;
            display: none;
        }

        #backButton {
            display: none;
            margin-bottom: 20px;
        }

        .progress-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .preloader-wrapper {
            display: block;
            margin: 0 auto;
        }

        .collection-item {
            border-bottom: 1px solid #e0e0e0;
            padding: 10px;
            margin: 0;
        }

        .nested-item {
            padding-left: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Справочные материалы</h3>
        <div id="backButton" class="btn waves-effect waves-light" onclick="showList()">
            <i class="material-icons left">arrow_back</i>Назад к списку
        </div>
        <div id="progressContainer" class="progress-container">
            <div class="preloader-wrapper big active">
                <div class="spinner-layer spinner-blue">
                    <div class="circle-clipper left">
                        <div class="circle"></div>
                    </div>
                    <div class="gap-patch">
                        <div class="circle"></div>
                    </div>
                    <div class="circle-clipper right">
                        <div class="circle"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="document-list" id="documentList" style="display:none;"></div>
        <iframe id="documentViewer"></iframe>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        $(document).ready(function () {
            // Показать прогресс-бар
            $("#progressContainer").show();
            $("#documentList").hide();

            $.getJSON("https://script.google.com/macros/s/AKfycbzUxAL2WuylYShG7VcOt743XJxAHR7BH_QyBjCaHF3cUWziGegRPefRFcIuc8rJQMNoiQ/exec", function (data) {
                buildList(data, $("#documentList"));
                // Скрыть прогресс-бар и показать список документов
                $("#progressContainer").hide();
                $("#documentList").show();
            }).fail(function (jqxhr, textStatus, error) {
                console.error("Request Failed: " + textStatus + ", " + error);
                // В случае ошибки скрыть прогресс-бар
                $("#progressContainer").hide();
            });
        });

        function buildList(data, parent) {
            let ul = $("<ul>");
            for (let key in data) {
                let li = $("<li>").text(key).addClass('collection-item').attr('tabindex', '0');
                ul.append(li);
                if (typeof data[key] === "string") {
                    li.click(function () {
                        openDocument(data[key]);
                    });
                    li.keypress(function (event) {
                        if (event.which == 13) {
                            openDocument(data[key]);
                        }
                    });
                } else {
                    let subUl = $("<ul>").addClass('nested-item');
                    buildList(data[key], subUl);
                    li.append(subUl);
                }
            }
            parent.append(ul);
        }

        function openDocument(url) {
            const iframe = $("#documentViewer");
            const previewUrl = url.replace("/edit", "/preview");
            $("#progressContainer").show();
            iframe.attr("src", url).hide();
            $("#documentList").hide();
            $("#backButton").show();

            iframe.on('load', function () {

                

                const iframeContent = iframe[0].contentWindow.document;
              
                var timer = setInterval(function () {
                    const docsChrome =  iframeContent.getElementById('docs-chrome');
                    if (docsChrome) {
                        
                        const menuElements = iframeContent.querySelectorAll("#docs-chrome");
                        menuElements.forEach(el => el.style.display = 'none');
                        
                        iframe.show();
                        $("#progressContainer").hide();
                        clearInterval(timer);
                    }
                    
                    
                   
                }, 200);
               
            });
        }

        function showList() {
            $("#documentViewer").hide();
            $("#backButton").hide();
            $("#documentList").show();
        }
    </script>
</body>

</html>
